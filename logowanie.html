<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Sport - logowanie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="pasek-glowny">
        <div class="pasek-glowny-wnetrze">
             <h2 class="marka">Neo Sport</h2>
            <a class="bez-podkreslenia" href="index.html">⮎ Powrót do strony głównej</a>
            <!-- https://pl.wikibooks.org/wiki/Unicode/R%C3%B3%C5%BCne_symbole_i_strza%C5%82ki -->        
        </div>
    </header>
    <main class="tlo-strony">
        <div class="logowanie-panel">
            <h1>Zaloguj się</h1>
            <form class="formularz-szukaj drugi" action="#" method="post">
                <label for="email">Email:</label><br>
                <input  type="email" id="email" name="email" placeholder="email@przyklad.com" required><br><br>
                <label class="formularz-szukaj drugi" for="password">Hasło:</label><br>
                <input  type="password" id="password" name="password" placeholder="Wpisz swoje hasło" required><br><br>
                <button class="przycisk2" type="submit">Zaloguj się</button>
            </form>
        </div>        
    </main>

</body>
</html>
